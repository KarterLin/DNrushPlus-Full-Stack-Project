<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用戶管理 - DN Kartrider Team</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .main-content {
            min-height: 100vh;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 側邊欄 -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="/admin">
                                <i class="bi bi-house"></i> 儀表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/navigation">
                                <i class="bi bi-list"></i> 導航欄管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/content">
                                <i class="bi bi-file-text"></i> 網站內容
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/images">
                                <i class="bi bi-image"></i> 圖片管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/team">
                                <i class="bi bi-people"></i> 團隊成員
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/contact-submissions">
                                <i class="bi bi-envelope"></i> 聯絡表單
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/admin/users">
                                <i class="bi bi-person-gear"></i> 用戶管理
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主要內容 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
                <!-- 當前用戶資訊 -->
                <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3">
                    <div>
                        <h1 class="h2 mb-0">用戶管理</h1>
                    </div>
                    <div class="d-flex align-items-center">
                        <span class="text-muted me-3">
                            總用戶數：<span th:text="${#lists.size(users)}">0</span>
                        </span>
                        <div class="d-flex align-items-center" th:if="${currentUser != null}">
                            <img th:src="${currentUser.profilePictureUrl}" alt="頭像" 
                                 class="rounded-circle me-2" width="32" height="32" 
                                 th:if="${currentUser.profilePictureUrl != null}">
                            <div class="text-end">
                                <div class="fw-bold" th:text="${currentUser.name}">用戶名稱</div>
                                <small class="text-muted" th:text="${currentUser.role}">角色</small>
                            </div>
                        </div>
                    </div>
                </div>
                <hr class="mb-3">

                <!-- 用戶列表 -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-people"></i> 用戶列表
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>頭像</th>
                                        <th>姓名</th>
                                        <th>Email</th>
                                        <th>角色</th>
                                        <th>註冊時間</th>
                                        <th>最後登入</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users}">
                                        <td>
                                            <img th:src="${user.profilePictureUrl}" 
                                                 th:alt="${user.name}" 
                                                 class="user-avatar"
                                                 onerror="this.src='/assets/img/default-avatar.svg'">
                                        </td>
                                        <td th:text="${user.name}">用戶姓名</td>
                                        <td th:text="${user.email}">user@example.com</td>
                                        <td>
                                            <span th:class="${user.role == T(com.dnrush.entity.User.Role).ADMIN} ? 'badge bg-danger' : 'badge bg-secondary'"
                                                  th:text="${user.role}">USER</span>
                                        </td>
                                        <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</td>
                                        <td th:text="${user.lastLogin != null ? #temporals.format(user.lastLogin, 'yyyy-MM-dd HH:mm') : '從未登入'}">2024-01-01 12:00</td>
                                        <td>
                                            <!-- 角色切換按鈕 -->
                                            <div th:if="${user.id == currentUser.id}" class="text-muted">
                                                <small><i class="bi bi-lock"></i> 無法修改自己的角色</small>
                                            </div>
                                            <div th:if="${user.id != currentUser.id}" class="btn-group" role="group">
                                                <button type="button" 
                                                        class="btn btn-sm btn-outline-primary"
                                                        th:classappend="${user.role == T(com.dnrush.entity.User.Role).USER} ? 'active' : ''"
                                                        th:onclick="'updateUserRole(' + ${user.id} + ', \'USER\')'">
                                                    USER
                                                </button>
                                                <button type="button" 
                                                        class="btn btn-sm btn-outline-danger"
                                                        th:classappend="${user.role == T(com.dnrush.entity.User.Role).ADMIN} ? 'active' : ''"
                                                        th:onclick="'updateUserRole(' + ${user.id} + ', \'ADMIN\')'">
                                                    ADMIN
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 用戶管理 JavaScript -->
    <script>
        function updateUserRole(userId, role) {
            if (confirm('確定要將用戶角色改為 ' + role + ' 嗎？')) {
                fetch('/admin/users/' + userId + '/role', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: 'role=' + encodeURIComponent(role)
                })
                .then(response => response.text())
                .then(result => {
                    if (result === 'success') {
                        // 重新載入頁面以更新角色顯示
                        location.reload();
                    } else {
                        alert('更新失敗：' + result);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('操作失敗，請稍後再試');
                });
            }
        }
    </script>
</body>
</html>
