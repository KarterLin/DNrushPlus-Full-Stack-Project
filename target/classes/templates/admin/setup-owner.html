<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設置 OWNER - DN Kartrider Team</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-warning text-dark">
                        <h4 class="mb-0">
                            <i class="bi bi-crown"></i> 設置 OWNER 權限
                        </h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i>
                            您即將設置最高管理員權限（OWNER）給以下帳號：
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><strong>用戶名稱：</strong></label>
                            <p class="form-control-plaintext" th:text="${userName}">用戶名稱</p>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><strong>電子郵件：</strong></label>
                            <p class="form-control-plaintext" th:text="${userEmail}">user@example.com</p>
                        </div>
                        
                        <div class="alert alert-warning">
                            <i class="bi bi-exclamation-triangle"></i>
                            <strong>注意：</strong>OWNER 擁有最高權限，無法被其他管理員修改或刪除。
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-warning" onclick="setupOwner()">
                                <i class="bi bi-crown"></i> 確認設置為 OWNER
                            </button>
                            <a href="/admin" class="btn btn-secondary">取消</a>
                        </div>
                        
                        <div id="result-message" class="mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function setupOwner() {
            const button = document.querySelector('button[onclick="setupOwner()"]');
            const resultDiv = document.getElementById('result-message');
            
            // 禁用按鈕
            button.disabled = true;
            button.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> 設置中...';
            
            fetch('/admin/setup-owner', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                resultDiv.style.display = 'block';
                
                if (data.success) {
                    resultDiv.className = 'alert alert-success mt-3';
                    resultDiv.innerHTML = '<i class="bi bi-check-circle"></i> ' + data.message + 
                                         '<br><small>頁面將在 3 秒後自動跳轉...</small>';
                    
                    // 3 秒後跳轉到管理後台
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 3000);
                } else {
                    resultDiv.className = 'alert alert-danger mt-3';
                    resultDiv.innerHTML = '<i class="bi bi-exclamation-circle"></i> ' + data.message;
                    
                    // 重新啟用按鈕
                    button.disabled = false;
                    button.innerHTML = '<i class="bi bi-crown"></i> 確認設置為 OWNER';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                resultDiv.style.display = 'block';
                resultDiv.className = 'alert alert-danger mt-3';
                resultDiv.innerHTML = '<i class="bi bi-exclamation-circle"></i> 請求失敗，請稍後再試';
                
                // 重新啟用按鈕
                button.disabled = false;
                button.innerHTML = '<i class="bi bi-crown"></i> 確認設置為 OWNER';
            });
        }
    </script>
</body>
</html>
